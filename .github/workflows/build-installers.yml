name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: "build-installers-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: "Build ${{ matrix.target }} installer"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            source_glob: release/*.AppImage
            output_name: CourseForge-Linux.AppImage
          - os: windows-latest
            target: win
            source_glob: release/*.exe
            output_name: CourseForge-Windows.exe
          - os: macos-latest
            target: mac
            source_glob: release/*.dmg
            output_name: CourseForge-macOS.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Build ${{ matrix.target }} installer"
        run: "npm run build:${{ matrix.target }} -- --publish never"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Validate macOS app bundle in DMG
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          dmgs=( release/*.dmg )
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No DMG found in release/"
            exit 1
          fi

          dmg="${dmgs[0]}"
          mount_dir="$(mktemp -d)"

          cleanup() {
            if mount | grep -q "$mount_dir"; then
              hdiutil detach "$mount_dir" -quiet || true
            fi
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" -quiet

          app_path="$mount_dir/CourseForge.app"
          if [ ! -d "$app_path" ]; then
            echo "Missing app bundle in DMG: $app_path"
            exit 1
          fi

          if find "$app_path" -mindepth 2 -type d -name 'CourseForge.app' | grep -q .; then
            echo "Unexpected self-nested CourseForge.app bundle detected"
            find "$app_path" -mindepth 2 -type d -name 'CourseForge.app'
            exit 1
          fi

          for required in "Contents/Info.plist" "Contents/MacOS" "Contents/Resources"; do
            if [ ! -e "$app_path/$required" ]; then
              echo "Missing required bundle path: $required"
              exit 1
            fi
          done

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          executable_path="$app_path/Contents/MacOS/$executable_name"
          if [ ! -f "$executable_path" ]; then
            echo "CFBundleExecutable missing: $executable_path"
            exit 1
          fi

          size_bytes="$(stat -f '%z' "$executable_path")"
          if [ "$size_bytes" -le 0 ]; then
            echo "Main executable has zero size: $executable_path"
            exit 1
          fi

          if [ ! -x "$executable_path" ]; then
            echo "Main executable is not executable (+x): $executable_path"
            exit 1
          fi

          broken_links=$(find "$app_path/Contents/MacOS" "$app_path/Contents/Resources" -type l ! -exec test -e {} \; -print)
          if [ -n "$broken_links" ]; then
            echo "Broken symlinks found:"
            echo "$broken_links"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Prepare durable installer filename
        id: durable_installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/durable
          shopt -s nullglob
          matches=( ${{ matrix.source_glob }} )
          if [ ${#matches[@]} -eq 0 ]; then
            echo "No installer found for pattern: ${{ matrix.source_glob }}"
            ls -la release || true
            exit 1
          fi

          cp "${matches[0]}" "release/durable/${{ matrix.output_name }}"
          echo "installer_path=release/durable/${{ matrix.output_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.output_name }}"
          path: "${{ steps.durable_installer.outputs.installer_path }}"
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ steps.durable_installer.outputs.installer_path }}"
          fail_on_unmatched_files: true