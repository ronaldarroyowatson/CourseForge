name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: "build-installers-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: "Build ${{ matrix.target }} installer"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: courseforge-linux
          - os: windows-latest
            target: win
            artifact: courseforge-windows
          - os: macos-latest
            target: mac
            artifact: courseforge-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Build ${{ matrix.target }} installer"
        run: "npm run build:${{ matrix.target }} -- --publish never"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.artifact }}"
          path: release/**
          if-no-files-found: error