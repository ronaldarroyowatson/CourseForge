name: Build CourseForge Installers
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "courseforge-installers-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-installers:
    name: "Build ${{ matrix.target }} installer"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            source_glob: release/*.exe
            output_name: CourseForge-Windows.exe
          - os: ubuntu-latest
            target: linux
            source_glob: release/*.AppImage
            output_name: CourseForge-Linux.AppImage
          - os: macos-latest
            target: mac
            source_glob: release/*.dmg
            output_name: CourseForge-macOS.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Otto update and CourseForge manifests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const courseforgeManifestPath = "manifests/courseforge-manifest.json";
          const ottoPayloadPath = "deployment/otto-payload.json";
          const requiredComponents = [
            "otto-kernel",
            "otto-update-engine",
            "otto-command-service",
            "courseforge-core-shell"
          ];

          const courseforgeManifest = JSON.parse(fs.readFileSync(courseforgeManifestPath, "utf8"));
          const ottoPayload = JSON.parse(fs.readFileSync(ottoPayloadPath, "utf8"));

          const manifestComponents = new Set(
            (courseforgeManifest.otto?.requiredComponents ?? []).map(String)
          );
          const payloadComponents = new Set(
            (ottoPayload.components ?? []).map((component) => String(component.name))
          );

          for (const component of requiredComponents) {
            if (!manifestComponents.has(component) && !payloadComponents.has(component)) {
              throw new Error(`Missing required Otto integration component: ${component}`);
            }
          }

          console.log("Manifest validation passed for Otto update integration.");
          NODE

      - name: Build installer
        run: "npm run build:${{ matrix.target }} -- --publish never"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Prepare durable installer filename
        id: durable_installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/durable
          shopt -s nullglob
          matches=( ${{ matrix.source_glob }} )
          if [ ${#matches[@]} -eq 0 ]; then
            echo "No installer found for pattern: ${{ matrix.source_glob }}"
            ls -la release || true
            exit 1
          fi

          cp "${matches[0]}" "release/durable/${{ matrix.output_name }}"
          echo "installer_path=release/durable/${{ matrix.output_name }}" >> "$GITHUB_OUTPUT"

      - name: Verify Linux installer in CI
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          installer="${{ steps.durable_installer.outputs.installer_path }}"
          chmod +x "$installer"
          "$installer" --appimage-extract > /dev/null 2>&1
          test -d squashfs-root
          test -f squashfs-root/AppRun
          rm -rf squashfs-root

      - name: Generate Otto update metadata artifact
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";

          const installerPath = process.env.INSTALLER_PATH;
          const payload = JSON.parse(fs.readFileSync("deployment/otto-payload.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync("manifests/courseforge-manifest.json", "utf8"));
          const bytes = fs.readFileSync(installerPath);
          const checksum = crypto.createHash("sha256").update(bytes).digest("hex");

          const metadata = {
            generatedAtUtc: new Date().toISOString(),
            installer: installerPath,
            sha256: checksum,
            courseforgeVersion: manifest.version,
            releaseChannel: payload.releaseChannel,
            mode: payload.mode
          };

          fs.writeFileSync(
            `release/durable/otto-update-metadata-${process.env.TARGET}.json`,
            JSON.stringify(metadata, null, 2)
          );
          NODE
        env:
          INSTALLER_PATH: "${{ steps.durable_installer.outputs.installer_path }}"
          TARGET: "${{ matrix.target }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.output_name }}"
          path: "${{ steps.durable_installer.outputs.installer_path }}"
          if-no-files-found: error

      - name: Upload Otto update metadata
        uses: actions/upload-artifact@v4
        with:
          name: "otto-update-metadata-${{ matrix.target }}"
          path: "release/durable/otto-update-metadata-${{ matrix.target }}.json"
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ steps.durable_installer.outputs.installer_path }}"
          fail_on_unmatched_files: true

  notify-orchestrator:
    name: Notify CourseForge-Orchestrator
    runs-on: ubuntu-latest
    needs:
      - build-installers
    if: always()
    steps:
      - name: Repository dispatch to orchestrator
        uses: peter-evans/repository-dispatch@v3
        with:
          token: "${{ secrets.ORCHESTRATOR_REPO_DISPATCH_TOKEN }}"
          repository: "${{ vars.COURSEFORGE_ORCHESTRATOR_REPO }}"
          event-type: courseforge-installer-build-complete
          client-payload: '{"sourceRepo":"${{ github.repository }}","runId":"${{ github.run_id }}","status":"${{ needs.build-installers.result }}","ref":"${{ github.ref }}"}'