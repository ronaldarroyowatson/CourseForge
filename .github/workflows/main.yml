name: Build Installers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Otto + CourseForge
        run: npm run build

      - name: Package Windows Installer
        run: npm run build:win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: courseforge-windows-installer
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Otto + CourseForge
        run: npm run build

      - name: Package macOS Installer
        run: npm run build:mac -- --publish never

      - name: Validate macOS app bundle in DMG
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          dmgs=( release/*.dmg )
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No DMG found in release/"
            exit 1
          fi

          dmg="${dmgs[0]}"
          mount_dir="$(mktemp -d)"

          cleanup() {
            if mount | grep -q "$mount_dir"; then
              hdiutil detach "$mount_dir" -quiet || true
            fi
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          app_path="$mount_dir/CourseForge.app"

          for required in "Contents/Info.plist" "Contents/MacOS" "Contents/Resources"; do
            if [ ! -e "$app_path/$required" ]; then
              echo "Missing required bundle path: $required"
              exit 1
            fi
          done

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          executable_path="$app_path/Contents/MacOS/$executable_name"
          test -f "$executable_path"
          test -x "$executable_path"
          test "$(stat -f '%z' "$executable_path")" -gt 0

          broken_links=$(find "$app_path/Contents/MacOS" "$app_path/Contents/Resources" -type l ! -exec test -e {} \; -print)
          if [ -n "$broken_links" ]; then
            echo "Broken symlinks found:"
            echo "$broken_links"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: courseforge-macos-installer
          path: release/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Otto + CourseForge
        run: npm run build

      - name: Package Linux Installer
        run: npm run build:linux

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: courseforge-linux-installer
          path: dist/*.AppImage
