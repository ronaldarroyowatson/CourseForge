name: Build Installers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Otto + CourseForge
        run: npm run build

      - name: Package Windows Installer
        run: npm run build:win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: courseforge-windows-installer
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Otto + CourseForge
        run: npm run build

      - name: Package macOS Installer
        run: npm run build:mac

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: courseforge-macos-installer
          path: dist/*.pkg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Otto + CourseForge
        run: npm run build

      - name: Package Linux Installer
        run: npm run build:linux

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: courseforge-linux-installer
          path: dist/*.AppImage
