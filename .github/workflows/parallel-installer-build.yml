name: Parallel Installer Matrix Build

on:
  workflow_dispatch:
    inputs:
      releaseDescription:
        description: Release description for build notes
        required: true
        type: string
      gitRef:
        description: Branch, tag, or commit to build
        required: false
        default: main
        type: string
      buildMacos:
        description: Build macOS artifacts
        required: false
        default: false
        type: boolean
      buildWindows:
        description: Build Windows artifacts
        required: false
        default: true
        type: boolean
      buildLinux:
        description: Run Linux installer/package verification
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  macos-installer:
    if: ${{ inputs.buildMacos }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitRef }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build macOS artifacts
        run: npm run package:macos

      - name: Verify macOS artifacts
        run: npm run verify:macos

      - name: Generate checksums
        run: |
          VERSION='${{ steps.version.outputs.value }}'
          mkdir -p release/checksums
          shasum -a 256 "release/CourseForge-${VERSION}-macos-portable.zip" > "release/checksums/macos-portable.sha256"
          shasum -a 256 "release/CourseForge-${VERSION}-macos.dmg" > "release/checksums/macos-dmg.sha256"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ steps.version.outputs.value }}
          if-no-files-found: error
          path: |
            release/CourseForge-${{ steps.version.outputs.value }}-macos-portable.zip
            release/CourseForge-${{ steps.version.outputs.value }}-macos.dmg
            release/CourseForge-${{ steps.version.outputs.value }}-macos/**
            release/checksums/macos-portable.sha256
            release/checksums/macos-dmg.sha256

  windows-installer:
    if: ${{ inputs.buildWindows }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitRef }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Path package.json -Raw | ConvertFrom-Json).version
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          npm run package:windows -- -AllowLegacyBootstrap

      - name: Verify Windows artifacts
        shell: pwsh
        run: npm run verify:windows

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory -Force -Path release/checksums | Out-Null
          $portableZip = "release/CourseForge-$version-portable.zip"
          $windowsZip = "release/CourseForge-$version-windows.zip"
          $windowsInstaller = "release/CourseForge-$version-installer.exe"

          if (Test-Path $portableZip) {
            (Get-FileHash -Path $portableZip -Algorithm SHA256).Hash + "  " + (Split-Path $portableZip -Leaf) | Set-Content -Path "release/checksums/windows-portable.sha256" -Encoding ascii
          }
          if (Test-Path $windowsZip) {
            (Get-FileHash -Path $windowsZip -Algorithm SHA256).Hash + "  " + (Split-Path $windowsZip -Leaf) | Set-Content -Path "release/checksums/windows-zip.sha256" -Encoding ascii
          }
          if (Test-Path $windowsInstaller) {
            (Get-FileHash -Path $windowsInstaller -Algorithm SHA256).Hash + "  " + (Split-Path $windowsInstaller -Leaf) | Set-Content -Path "release/checksums/windows-installer.sha256" -Encoding ascii
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.value }}
          if-no-files-found: error
          path: |
            release/CourseForge-${{ steps.version.outputs.value }}-portable.zip
            release/CourseForge-${{ steps.version.outputs.value }}-windows.zip
            release/CourseForge-${{ steps.version.outputs.value }}-installer.exe
            release/CourseForge-${{ steps.version.outputs.value }}-windows/**
            release/checksums/windows-portable.sha256
            release/checksums/windows-zip.sha256
            release/checksums/windows-installer.sha256

  linux-installer-tests:
    if: ${{ inputs.buildLinux }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitRef }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build portable package (Linux host)
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/create-portable-package.ps1

      - name: Verify portable package (Linux host)
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts/verify-portable-package.ps1

      - name: Run installer lifecycle guardrails
        run: npm run test:installer:lifecycle

      - name: Generate checksum
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory -Force -Path release/checksums | Out-Null
          $portableZip = "release/CourseForge-$version-portable.zip"
          if (Test-Path $portableZip) {
            (Get-FileHash -Path $portableZip -Algorithm SHA256).Hash + "  " + (Split-Path $portableZip -Leaf) | Set-Content -Path "release/checksums/linux-portable.sha256" -Encoding ascii
          }

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer-${{ steps.version.outputs.value }}
          if-no-files-found: error
          path: |
            release/CourseForge-${{ steps.version.outputs.value }}-portable.zip
            release/CourseForge-${{ steps.version.outputs.value }}-portable/**
            release/checksums/linux-portable.sha256

  summarize:
    runs-on: ubuntu-latest
    needs:
      - macos-installer
      - windows-installer
      - linux-installer-tests
    if: ${{ always() }}
    steps:
      - name: Build summary
        run: |
          echo "# Parallel Installer Matrix Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release description: ${{ inputs.releaseDescription }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git ref: ${{ inputs.gitRef }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- macOS job result: ${{ needs.macos-installer.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows job result: ${{ needs.windows-installer.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Linux job result: ${{ needs.linux-installer-tests.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download artifacts from this workflow run to collect all installer outputs." >> "$GITHUB_STEP_SUMMARY"
